name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - uses: ./.github/actions/browsers
      - run: make check
      - name: Website builds
        run: npm run build && npm run site
      - run: actionlint
