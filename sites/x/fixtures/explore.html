<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Explore / X</title></head>
<body>
<div id="react-root">
  <main role="main">
    <div data-testid="primaryColumn">
      <div>
        <div id="explore-header">
          <form role="search"><input data-testid="SearchBox_Search_Input" placeholder="Search" id="explore-search"></form>
          <nav role="navigation">
            <div role="tablist" data-testid="ScrollSnap-List">
              <div role="presentation"><a href="/explore/tabs/for-you" role="tab" aria-selected="true">For You</a></div>
              <div role="presentation"><a href="/explore/tabs/trending" role="tab" aria-selected="false">Trending</a></div>
            </div>
          </nav>
        </div>
        <section role="region" id="explore-trends">
          <h1 role="heading">Explore</h1>
          <div aria-label="Timeline: Explore"><div><div data-testid="cellInnerDiv"><div data-testid="trend">#Topic</div></div></div></div>
        </section>
      </div>
    </div>
  </main>
</div>
</body></html>
