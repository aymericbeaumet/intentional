<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Post / X</title></head>
<body>
<div id="react-root">
  <main role="main">
    <div data-testid="primaryColumn">
      <div aria-label="Home timeline">
        <div id="post-header"><h2 role="heading"><span>Post</span></h2></div>
        <section role="region">
          <h1 role="heading">Conversation</h1>
          <div aria-label="Timeline: Conversation">
            <div>
              <div data-testid="cellInnerDiv" id="focal-tweet"><article data-testid="tweet" tabindex="-1">The post that was opened</article></div>
              <div data-testid="cellInnerDiv" id="reply-composer"><div data-testid="tweetTextarea_0" role="textbox">Post your reply</div></div>
              <div data-testid="cellInnerDiv" id="reply"><article data-testid="tweet"><a href="/friend/status/5555555555555555555">A reply</a></article></div>
              <div data-testid="cellInnerDiv" id="discover-more"><div><h2 role="heading"><div dir="ltr"><span>Discover more</span></div></h2><div dir="ltr"><span>Sourced from across X</span></div></div></div>
              <div data-testid="cellInnerDiv" id="discover-tweet-1"><article data-testid="tweet"><a href="/stranger/status/6666666666666666666">Recommended post</a></article></div>
              <div data-testid="cellInnerDiv" id="discover-tweet-2"><article data-testid="tweet"><a href="/stranger/status/7777777777777777777">Another recommended post</a></article></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div data-testid="sidebarColumn">
      <form role="search" id="sidebar-search"><input data-testid="SearchBox_Search_Input" placeholder="Search"></form>
      <div><aside role="complementary" aria-label="Relevant people" id="relevant-people">
        <div data-testid="UserCell"><a href="/someone">Someone</a><button>Follow</button></div>
      </aside></div>
    </div>
  </main>
</div>
</body></html>
