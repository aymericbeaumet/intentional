<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My Network | LinkedIn</title></head>
<body>
<header>
  <nav data-testid="primary-nav" aria-label="Primary">
    <ul>
      <li id="nav-home"><button aria-label="Home">Home</button></li>
      <li id="nav-network"><a href="https://www.linkedin.com/mynetwork/">My Network</a></li>
    </ul>
  </nav>
</header>
<div>
  <aside id="manage-network" aria-label="Manage my network">
    <a href="https://www.linkedin.com/mynetwork/invite-connect/connections/">Connections</a>
  </aside>
  <main id="main">
    <section id="invitations" aria-label="Invitations">
      <h2>Invitations</h2>
      <ul>
        <li id="invitation-card">
          <a href="https://www.linkedin.com/in/someone/">Someone</a>
          <button aria-label="Ignore an invitation to connect from Someone">Ignore</button>
          <button aria-label="Accept Someone’s invitation">Accept</button>
        </li>
      </ul>
    </section>
    <section aria-label="Suggestions">
      <h2>People you may know</h2>
      <ul>
        <li id="pymk-card"><a href="https://www.linkedin.com/in/stranger/">Stranger</a><button aria-label="Invite Stranger to connect">Connect</button></li>
      </ul>
      <h2>Pages for you</h2>
      <div role="list">
        <div id="follow-card" role="listitem"><a href="https://www.linkedin.com/company/acme/">Acme</a><div><button aria-label="Follow Acme">Follow</button></div></div>
      </div>
    </section>
  </main>
</div>
</body></html>
