<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Twitch</title></head>
<body>
<div id="root">
  <nav data-a-target="top-nav-container">
    <a data-a-target="home-link" id="home-link" aria-label="Twitch Home" href="/">Twitch</a>
    <a data-a-target="following-link" data-test-selector="top-nav__following-link" id="following-link" href="/directory/following">Following</a>
    <a data-a-target="browse-link" data-test-selector="top-nav__browse-link" id="browse-link" aria-label="Browse" href="/directory">Browse</a>
    <div data-a-target="nav-search-box" id="search"><input data-a-target="tw-input" aria-label="Search Input"></div>
  </nav>
  <div class="side-nav" data-test-selector="side-nav" data-a-target="side-nav-bar" role="complementary">
    <nav id="side-nav" aria-label="Left Navigation">
      <div aria-label="Followed Channels" class="side-nav-section" role="group" id="followed-section">
        <div data-a-target="side-nav-header-expanded"><h3>Followed Channels</h3></div>
        <a data-a-id="followed-channel-0" data-test-selector="followed-channel" class="side-nav-card__link" href="/followed">followed</a>
      </div>
      <div aria-label="Recommended Channels" class="side-nav-section" role="group" id="recommended-section">
        <div data-a-target="side-nav-header-expanded"><h3>Recommended Channels</h3></div>
        <a data-a-id="recommended-channel-0" data-test-selector="recommended-channel" class="side-nav-card__link" href="/someone">someone</a>
      </div>
    </nav>
  </div>
  <main>
    <div data-a-target="root-scroller">
      <div data-a-target="front-page-carousel" id="carousel"><div data-a-target="video-player">Featured stream</div></div>
      <section id="front-page-main-content" aria-label="Main Content" data-a-target="front-page-main-content">
        <div class="find-me"><h2><a href="/directory/all">Live on Twitch</a></h2><div><div class="shelf-card__impression-wrapper"><div data-test-selector="shelf-card-selector"><a href="/someone">Recommended stream</a></div></div></div></div>
      </section>
    </div>
  </main>
</div>
</body></html>
