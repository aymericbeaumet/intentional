<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Channel - Twitch</title></head>
<body>
<div id="root">
  <nav data-a-target="top-nav-container">
    <a data-a-target="home-link" href="/">Twitch</a>
    <a data-a-target="following-link" id="following-link" href="/directory/following">Following</a>
    <a data-a-target="browse-link" id="browse-link" href="/directory">Browse</a>
  </nav>
  <div class="side-nav" data-test-selector="side-nav" data-a-target="side-nav-bar" role="complementary">
    <nav id="side-nav" aria-label="Left Navigation">
      <div aria-label="Followed Channels" class="side-nav-section" role="group" id="followed-section">
        <a data-a-id="followed-channel-0" data-test-selector="followed-channel" href="/followed">followed live</a>
        <a data-a-id="followed-channel-1" data-test-selector="followed-channel" href="/followed2">followed offline</a>
      </div>
      <div aria-label="Live Channels" class="side-nav-section" role="group" id="live-section">
        <a data-a-id="recommended-channel-0" data-test-selector="recommended-channel" href="/someone">someone</a>
      </div>
      <div aria-label="Collab Channels" class="side-nav-section" role="group" id="collab-section">
        <a data-a-id="recommended-collab-channel-0" data-test-selector="recommended-collab-channel" href="/collab">collab</a>
      </div>
      <div aria-label="Popular Channels" class="side-nav-section" role="group" id="popular-section">
        <a data-a-id="popular-channel-0" data-test-selector="popular-channel" href="/popular">popular</a>
      </div>
      <div aria-label="Recommended Categories" class="side-nav-section" role="group" id="categories-section">
        <a data-a-id="category-0" data-test-selector="category" href="/directory/category/just-chatting">Just Chatting</a>
      </div>
      <div aria-label="Channel Viewers Also Watch" class="side-nav-section" role="group" id="similar-section">
        <a data-a-id="similarity-channel-0" data-test-selector="similarity-channel" href="/similar">similar</a>
      </div>
    </nav>
  </div>
  <main>
    <div data-a-target="root-scroller">
      <div data-a-target="video-player" id="player"><video aria-label="Twitch video player"></video></div>
      <div id="channel-info"><h1>channel</h1><button data-a-target="follow-button" id="follow-button">Follow</button></div>
      <div>
        <a data-a-target="channel-home-tab-Home" href="/channel">Home</a>
        <a data-a-target="channel-home-tab-Videos" id="tab-videos" href="/channel/videos">Videos</a>
      </div>
    </div>
  </main>
  <aside aria-label="Stream Chat" id="chat"><div data-a-target="chat-scroller">Chat</div></aside>
</div>
</body></html>
