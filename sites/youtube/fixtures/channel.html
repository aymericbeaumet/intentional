<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Channel - YouTube</title></head>
<body>
<ytd-app>
  <ytd-page-manager id="page-manager">
    <ytd-browse page-subtype="channels">
      <yt-tab-group-shape>
        <yt-tab-shape id="tab-videos" tab-title="Videos">Videos</yt-tab-shape>
        <yt-tab-shape id="tab-shorts" tab-title="Shorts">Shorts</yt-tab-shape>
        <yt-tab-shape id="tab-playlists" tab-title="Playlists">Playlists</yt-tab-shape>
      </yt-tab-group-shape>
    </ytd-browse>
  </ytd-page-manager>
</ytd-app>
</body></html>
