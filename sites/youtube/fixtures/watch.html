<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Video - YouTube</title></head>
<body>
<ytd-app>
  <ytd-page-manager id="page-manager">
    <ytd-watch-flexy>
      <div id="columns">
        <div id="primary">
          <div id="player">
            <div class="html5-video-player" id="movie_player">
              <video id="video"></video>
              <div class="ytp-chrome-bottom"><button class="ytp-button" id="autoplay-toggle" data-tooltip-target-id="ytp-autonav-toggle-button">Autoplay</button></div>
              <div class="ytp-ce-element ytp-ce-video" id="end-card">End card</div>
              <div class="html5-endscreen ytp-player-content videowall-endscreen" id="videowall"><div class="ytp-endscreen-content" id="endscreen">Up next</div></div>
              <div class="ytp-fullscreen-grid" id="fullscreen-grid">More videos</div>
            </div>
          </div>
          <div id="below">
            <ytd-watch-metadata id="metadata">Title</ytd-watch-metadata>
            <ytd-comments id="comments">Comments</ytd-comments>
          </div>
        </div>
        <div id="secondary"><div id="secondary-inner">
          <div id="related"><ytd-watch-next-secondary-results-renderer id="related-results"><a href="/watch?v=HHHHHHHHHHH">Related video</a></ytd-watch-next-secondary-results-renderer></div>
        </div></div>
      </div>
    </ytd-watch-flexy>
  </ytd-page-manager>
</ytd-app>
</body></html>
