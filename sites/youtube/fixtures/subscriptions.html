<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Subscriptions - YouTube</title></head>
<body>
<ytd-app>
  <ytd-page-manager id="page-manager">
    <ytd-browse id="browse-subscriptions" page-subtype="subscriptions">
      <ytd-rich-grid-renderer>
        <ytd-rich-item-renderer id="sub-video"><yt-lockup-view-model><a href="/watch?v=CCCCCCCCCCC">Video from a subscription</a></yt-lockup-view-model></ytd-rich-item-renderer>
        <ytd-rich-section-renderer id="sub-shorts-section"><ytd-rich-shelf-renderer is-shorts><a href="/shorts/DDDDDDDDDDD">Short</a></ytd-rich-shelf-renderer></ytd-rich-section-renderer>
        <ytd-rich-item-renderer id="sub-short-item"><ytm-shorts-lockup-view-model-v2><a href="/shorts/EEEEEEEEEEE">Short</a></ytm-shorts-lockup-view-model-v2></ytd-rich-item-renderer>
        <grid-shelf-view-model id="sub-shorts-grid"><a href="/shorts/FFFFFFFFFFF">Short</a></grid-shelf-view-model>
        <yt-lockup-view-model id="sub-short-lockup"><a href="/shorts/GGGGGGGGGGG">Short</a></yt-lockup-view-model>
      </ytd-rich-grid-renderer>
    </ytd-browse>
  </ytd-page-manager>
</ytd-app>
</body></html>
