<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Search - YouTube</title></head>
<body>
<ytd-app>
  <ytd-page-manager id="page-manager">
    <ytd-search>
      <yt-chip-cloud-renderer>
        <yt-chip-cloud-chip-renderer id="chip-all">All</yt-chip-cloud-chip-renderer>
        <yt-chip-cloud-chip-renderer id="chip-shorts"> Shorts </yt-chip-cloud-chip-renderer>
        <yt-chip-cloud-chip-renderer id="chip-videos">Videos</yt-chip-cloud-chip-renderer>
      </yt-chip-cloud-renderer>
      <div id="contents">
        <ytd-video-renderer id="result-video"><a href="/watch?v=IIIIIIIIIII">Matching video</a></ytd-video-renderer>
        <ytd-video-renderer id="result-short"><a href="/shorts/JJJJJJJJJJJ">Matching short</a></ytd-video-renderer>
        <ytd-reel-shelf-renderer id="result-reel-shelf"><a href="/shorts/KKKKKKKKKKK">Shorts shelf</a></ytd-reel-shelf-renderer>
        <ytd-shelf-renderer id="result-people-also-watched">People also watched</ytd-shelf-renderer>
        <ytd-horizontal-card-list-renderer id="result-searches">People also search for</ytd-horizontal-card-list-renderer>
        <ytd-grid-video-renderer id="result-grid-short"><a href="/shorts/LLLLLLLLLLL">Short</a></ytd-grid-video-renderer>
      </div>
    </ytd-search>
  </ytd-page-manager>
</ytd-app>
</body></html>
