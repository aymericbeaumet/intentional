<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>YouTube</title></head>
<body>
<ytm-app>
  <ytm-browse>
    <div class="tab-content" id="m-home-feed" tab-identifier="FEwhat_to_watch">
      <ytm-rich-item-renderer id="m-home-video"><a href="/watch?v=NNNNNNNNNNN">Recommended video</a></ytm-rich-item-renderer>
    </div>
  </ytm-browse>
  <ytm-pivot-bar-renderer>
    <ytm-pivot-bar-item-renderer id="m-pivot-home"><div class="pivot-bar-item-tab pivot-w2w">Home</div></ytm-pivot-bar-item-renderer>
    <ytm-pivot-bar-item-renderer id="m-pivot-shorts"><div class="pivot-bar-item-tab pivot-shorts">Shorts</div></ytm-pivot-bar-item-renderer>
    <ytm-pivot-bar-item-renderer id="m-pivot-subs"><div class="pivot-bar-item-tab pivot-subs">Subscriptions</div></ytm-pivot-bar-item-renderer>
  </ytm-pivot-bar-renderer>
</ytm-app>
</body></html>
