<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Video | Facebook</title></head>
<body>
<div id="mount">
  <div role="banner">
    <a id="logo" aria-label="Facebook" href="/" role="link">Facebook</a>
    <ul id="top-nav">
      <li><a id="top-home" aria-label="Home" href="/" role="link">Home</a></li>
      <li><a id="top-video" aria-label="Video" href="/watch/" role="link">Video</a></li>
    </ul>
  </div>
  <div aria-label="Shortcuts within Video" role="navigation">
    <h1>Video</h1>
    <input id="video-search" aria-label="Search videos" placeholder="Search videos" role="combobox">
    <div data-pagelet="LeftNav">
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-home" href="/watch/" role="link">Home</a></div>
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-live" href="/watch/live/?ref=watch" role="link">Live</a></div>
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-reels" href="/reel/?s=bookmark" role="link">Reels</a></div>
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-shows" href="/watch/shows/" role="link">Shows</a></div>
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-explore" href="/watch/topic/" role="link">Explore</a></div>
      <div data-visualcompletion="ignore-dynamic"><a id="vnav-saved" href="/watch/saved/" role="link">Saved videos</a></div>
    </div>
  </div>
  <div role="main">
    <div id="player"><video id="video" playsinline></video></div>
    <div id="video-meta">
      <a href="/SomePage/" role="link">Some Page</a>
      <a id="video-page-channel" href="/watch/100000000000001/" role="link">More from Some Page</a>
      <a id="live-permalink" href="/watch/live/?ref=watch_permalink&amp;v=3333333333333333" role="link">Live video</a>
      <a id="video-permalink" href="/watch/?ref=saved&amp;v=4444444444444444" role="link">Saved video</a>
    </div>
    <div id="video-comments"><div role="article">A comment</div></div>
    <div id="related-reels">
      <div><span>Related Reels</span></div>
      <div>
        <div role="button" aria-label="Previous items"></div>
        <div aria-label="Several videos for the search term Related Reels" role="region">
          <div><div data-type="hscroll-child"><a aria-label="reel" href="/reel/5555555555555555/?s=ifu" role="link">Reel</a></div></div>
        </div>
        <div role="button" aria-label="Next items"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
