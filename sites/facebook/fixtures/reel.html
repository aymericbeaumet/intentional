<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Facebook</title></head>
<body>
<div id="mount">
  <div role="banner"><a id="logo" aria-label="Facebook" href="/" role="link">Facebook</a></div>
  <div role="main">
    <div>
      <div>
        <div id="reel-prev" aria-disabled="true" aria-label="Previous Card" role="button" tabindex="-1"><svg aria-hidden="true"></svg></div>
        <div id="reel-card">
          <div>
            <div>
              <div data-visualcompletion="ignore-dynamic">
                <div data-pagelet="Reels"><div data-video-id="1670082768131967"><video id="reel-video" playsinline></video></div></div>
                <div id="reel-author"><a href="/SomePage/" role="link">Some Page</a></div>
              </div>
            </div>
          </div>
          <div id="reel-actions">
            <div aria-label="Like" role="button">Like</div>
            <div aria-label="Comment" role="button">Comment</div>
            <div aria-label="Share" role="button">Share</div>
          </div>
        </div>
        <div id="reel-next" aria-label="Next Card" role="button" tabindex="0"><svg aria-hidden="true"></svg></div>
      </div>
    </div>
    <div id="reel-crumb"><span dir="auto"><a id="reels-tab-link" href="/reel/" role="link">Reels</a></span></div>
    <a id="reel-close" aria-label="Close viewer and return to feed" href="/" role="link">Close</a>
  </div>
</div>
</body></html>
