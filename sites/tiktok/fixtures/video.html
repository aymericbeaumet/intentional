<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Video - TikTok</title></head>
<body>
<div id="app">
  <nav>
    <div><a data-e2e="nav-foryou" href="/">For You</a></div>
    <div><a data-e2e="nav-following" id="nav-following" href="/following">Following</a></div>
  </nav>
  <div>
    <div id="main-content-video_detail">

          <article id="one-column-item-0" data-scroll-index="0" data-e2e="recommend-list-item-container"><section id="media-card-0" data-e2e="feed-video"><video id="opened-video"></video></section><div data-e2e="video-desc" id="video-desc">Description</div></article>

      <div>
        <div data-testid="tux-web-tab-bar">

          <div><div data-testid="tux-web-tab-bar-container" id="tab-you-may-like"><button data-testid="tux-web-tab-bar"><span data-testid="tux-web-text">You may like</span></button></div></div>
        </div>
        <div id="comments"><div data-e2e="comment-level-1">A comment</div></div>
      </div>
    </div>
  </div>
</div>
